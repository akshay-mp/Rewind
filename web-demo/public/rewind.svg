<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rewind: a clock face fused with a circular rewind arrow.
       The arrowhead at top-left conveys "go back"; the clock hand at ~4 o'clock
       conveys "a point in time". Two-tone: indigo ring, violet hand. -->
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- rewind arrow arc (open ring, gap at top for the arrowhead) -->
  <path d="M 48 16 A 22 22 0 1 0 54 38"
        stroke="url(#rg)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- arrowhead pointing back (top-left) -->
  <path d="M 48 16 L 48 8 L 40 14 L 48 16 Z" fill="url(#rg)"/>
  <!-- clock hand (from center toward ~4 o'clock) -->
  <line x1="32" y1="32" x2="44" y2="40"
        stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#6366f1"/>
  <!-- two tick marks to read as a clock -->
  <line x1="32" y1="14" x2="32" y2="18" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="46" y2="32" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
</svg>
