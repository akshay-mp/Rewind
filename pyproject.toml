[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewind-ai"
version = "0.1.0"
description = "Time-travel debugging for AI agents — OTel-in / replay-out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rewind" }]
keywords = ["opentelemetry", "agents", "debugging", "replay", "time-travel"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "opentelemetry-proto>=1.28.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "sqlmodel>=0.0.22",
    "click>=8.1.0",
    "rich>=13.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pylint>=3.3.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
    "types-protobuf>=5.0.0",
]
web = [
    # web/ is a built artifact; no runtime node dependency.
]

[project.scripts]
rewind = "rewind.cli:main"

[project.urls]
Homepage = "https://github.com/example/rewind"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind"]

[tool.hatch.build.targets.sdist]
include = ["src/rewind", "README.md"]

# --- Ruff (strict) ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "S",             # bandit (security)
    "A",             # builtins shadowing
    "ANN",           # annotations
    "PT",            # pytest style
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
# SDK-boundary monkey-patch: signatures mirror OpenAI's variadic `create`
# which is genuinely `Any`-typed. The rest of the codebase stays strict.
"src/rewind/openai_intercept.py" = ["ANN401"]
"src/rewind/tool_intercept.py" = ["ANN401"]
"src/rewind/adapters/**" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

# --- Pylint (strict) -------------------------------------------------------
[tool.pylint.main]
py-version = "3.11"
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",   # dataclasses/pydantic models
    "too-many-arguments",       # OTel proto parsing
    "too-many-positional-arguments",
    "too-many-return-statements",  # dispatch heuristics (classifier)
]

[tool.pylint.design]
max-line-length = 100

[tool.pylint.format]
max-line-length = 100

# Test fixtures reuse parameter names like ``store``/``trace_id`` by design —
# that's how pytest dependency-injection works.
[tool.pylint."tests/**"]
disable = [
    "redefined-outer-name",  # pytest fixtures
    "missing-function-docstring",  # test functions document themselves
    "missing-class-docstring",  # stub/fake classes are intentional
    "unused-argument",  # orig_create stubs need the SDK's full signature
    "import-outside-toplevel",  # tests frequently import builtins late
    "use-implicit-booleaness-not-comparison",  # explicit `== []` is clearer
]

# --- mypy (strict) ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["rewind"]

[[tool.mypy.overrides]]
# Generated protobuf modules — namespaced as ``opentelemetry.proto.*``
# (NOT ``opentelemetry_proto.*`` — that was the wheel name on PyPI, not the
# import path). Stubs are absent; ignore at the import surface, not project-wide.
module = ["opentelemetry.proto.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional agent-framework dependencies: Rewind ships without requiring
# langchain_core or openai at install time (lazy imports). The adapters
# are only type-checked when the framework is present in the developer's
# venv; otherwise the import surface is opaque to mypy.
module = ["langchain_core.*", "langchain.*", "openai.*"]
ignore_missing_imports = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rewind",
    "--cov-report=term-missing",
]
markers = [
    "integration: end-to-end tests that exercise multiple components",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["src/rewind"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
