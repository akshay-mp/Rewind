version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-non-breaking:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-non-breaking:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /web-demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-demo-non-breaking:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-non-breaking:
        update-types:
          - minor
          - patch
